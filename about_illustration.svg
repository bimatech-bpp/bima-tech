<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="640" rx="24" fill="#0F52BA"/>
  <circle cx="320" cy="230" r="120" fill="#0B3D91" opacity="0.5"/>

  <!-- desk -->
  <rect x="80" y="430" width="480" height="18" rx="4" fill="#0B3D91"/>

  <!-- laptop -->
  <g>
    <rect x="220" y="330" width="200" height="120" rx="10" fill="#FFFFFF"/>
    <rect x="235" y="345" width="170" height="90" rx="4" fill="#0B3D91"/>
    <rect x="150" y="448" width="340" height="14" rx="6" fill="#E7EEFB"/>
  </g>

  <!-- person (simple flat figure) -->
  <g>
    <circle cx="320" cy="230" r="46" fill="#F5C6A0"/>
    <path d="M274 225 q46 -46 92 0 v-10 a46 46 0 0 0 -92 0 z" fill="#0B1B3A"/>
    <path d="M230 420 q0 -95 90 -95 q90 0 90 95 z" fill="#0B3D91"/>
  </g>

  <!-- screwdriver hand accent -->
  <g stroke="#F5A623" stroke-width="10" stroke-linecap="round">
    <line x1="400" y1="330" x2="440" y2="290"/>
  </g>

  <!-- badge -->
  <g transform="translate(400,120)">
    <circle cx="0" cy="0" r="54" fill="#F5A623"/>
    <path d="M-18 0 l12 12 26 -26" stroke="#231400" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
